<!doctype html>
<!--
  The stage: the ground the recording stands on, as a window with a slim browser bar.

  Rendered to two still images by src/lib/stage.ts:
  - "base": the whole scene, opaque - the ground, the window's shadow, the window.
  - "top": only what lies over the recording - the bar with the site's host, the
    ground in the four rounded corners, and a hairline round the window's edge.
  The composition lays the recording between the two.

  Slots: {{width}} {{height}} (the video), {{x}} {{y}} {{w}} {{h}} (the window, bar
  included), {{bar}} (bar height), {{radius}}, {{scale}} (1 at 1080p), {{host}},
  {{layer}}.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
    <link rel="stylesheet" href="brand.css" />
    <style>
      html,
      body {
        width: {{width}}px;
        height: {{height}}px;
      }
      #scene {
        position: absolute;
        inset: 0;
      }
      .ground {
        position: absolute;
        inset: 0;
      }
      #window {
        position: absolute;
        left: {{x}}px;
        top: {{y}}px;
        width: {{w}}px;
        height: {{h}}px;
        border-radius: {{radius}}px;
        background: #0a1826;
        box-shadow:
          0 calc(40px * {{scale}}) calc(110px * {{scale}}) rgba(0, 0, 0, 0.55),
          0 calc(12px * {{scale}}) calc(32px * {{scale}}) rgba(0, 0, 0, 0.35);
      }
      #bar {
        position: absolute;
        left: {{x}}px;
        top: {{y}}px;
        width: {{w}}px;
        height: {{bar}}px;
        border-radius: {{radius}}px {{radius}}px 0 0;
        background: linear-gradient(180deg, #102538 0%, #0c1d2c 100%);
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        box-sizing: border-box;
        display: flex;
        align-items: center;
      }
      #dots {
        position: absolute;
        left: calc(18px * {{scale}});
        display: flex;
        gap: calc(8px * {{scale}});
      }
      #dots span {
        width: calc(11px * {{scale}});
        height: calc(11px * {{scale}});
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.16);
      }
      #address {
        margin: 0 auto;
        min-width: 28%;
        max-width: 60%;
        height: calc(26px * {{scale}});
        padding: 0 calc(16px * {{scale}});
        border-radius: calc(13px * {{scale}});
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: calc(8px * {{scale}});
        font: 500 calc(14px * {{scale}}) / 1 'Segoe UI', Inter, system-ui, sans-serif;
        color: var(--muted);
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
      }
      #address svg {
        width: calc(12px * {{scale}});
        height: calc(12px * {{scale}});
        flex: none;
      }
      #address.empty {
        visibility: hidden;
      }
      #outline {
        position: absolute;
        left: {{x}}px;
        top: {{y}}px;
        width: {{w}}px;
        height: {{h}}px;
        border-radius: {{radius}}px;
        box-sizing: border-box;
        border: 1px solid rgba(255, 255, 255, 0.09);
        display: none;
      }
      body.top #outline {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div class="ground"></div>
      <div class="glow cyan"></div>
      <div class="glow magenta"></div>
      <div class="grain"></div>
      <div id="window"></div>
      <div id="bar">
        <div id="dots"><span></span><span></span><span></span></div>
        <div id="address">
          <svg viewBox="0 0 12 12" fill="none" stroke="#9fb3c2" stroke-width="1.4">
            <rect x="2" y="5.2" width="8" height="5.6" rx="1.2" />
            <path d="M4 5.2V3.8a2 2 0 0 1 4 0v1.4" />
          </svg>
          <span id="host">{{host}}</span>
        </div>
      </div>
    </div>
    <div id="outline"></div>

    <script>
      if (!document.getElementById('host').textContent.trim()) {
        document.getElementById('address').classList.add('empty')
      }

      // The top layer keeps only what lies over the recording: the bar, and the
      // ground outside the window's rounded corners. Everything else is cut away, so
      // the shadow and the ground come from the base layer beneath the recording.
      if ('{{layer}}' === 'top') {
        document.body.classList.add('top')
        const [x, y, w, h, bar, r] = [{{x}}, {{y}}, {{w}}, {{h}}, {{bar}}, {{radius}}]
        const rounded =
          `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}` +
          `A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}` +
          `V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" width="{{width}}" height="{{height}}">` +
          `<path fill="#fff" fill-rule="evenodd" d="M${x} ${y}h${w}v${h}h-${w}Z${rounded}"/>` +
          `<rect fill="#fff" x="${x}" y="${y}" width="${w}" height="${bar}"/></svg>`
        const mask = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`
        const scene = document.getElementById('scene')
        scene.style.webkitMaskImage = mask
        scene.style.maskImage = mask
        scene.style.webkitMaskSize = scene.style.maskSize = '100% 100%'
      } else {
        document.body.style.background = 'var(--navy)'
      }
    </script>
  </body>
</html>
