<!doctype html>
<!--
  Chapter card, laid over the recording at the moment tutorial_chapter was called.

  Rendered with a transparent background: the page stays faintly visible under a
  navy veil, so the viewer does not lose their place in the app. Filled in by
  src/lib/motion.ts: {{title}}, {{description}}, {{counter}} ("02 / 04", or empty)
  and {{duration}} (seconds).
-->
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" />
    <link rel="stylesheet" href="brand.css" />
    <script src="gsap.min.js"></script>
    <style>
      #veil {
        position: absolute;
        inset: 0;
        background: radial-gradient(110% 100% at 25% 45%, rgba(6, 30, 48, 0.9) 0%, rgba(4, 20, 34, 0.94) 60%, rgba(2, 11, 20, 0.96) 100%);
      }
      #block {
        position: absolute;
        left: 160px;
        top: 0;
        bottom: 0;
        width: 1500px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #counter {
        margin-bottom: 26px;
        font-variant-numeric: tabular-nums;
      }
      #title {
        font-size: 96px;
        font-weight: 700;
        letter-spacing: -0.03em;
        line-height: 1.05;
      }
      #rule {
        width: 260px;
        margin: 38px 0 32px;
      }
      #description {
        font-size: 38px;
        font-weight: 500;
        color: var(--muted);
        line-height: 1.3;
        max-width: 1300px;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="chapter" data-start="0" data-duration="{{duration}}" data-width="1920" data-height="1080">
      <div class="clip" data-start="0" data-duration="{{duration}}" data-track-index="0">
        <div id="veil"></div>
      </div>
      <div class="clip" data-start="0" data-duration="{{duration}}" data-track-index="1">
        <div id="block">
          <div id="counter" class="eyebrow optional">{{counter}}</div>
          <div class="mask"><h1 id="title">{{title}}</h1></div>
          <div id="rule" class="rule"></div>
          <div id="description" class="optional">{{description}}</div>
        </div>
      </div>
    </div>

    <script>
      const duration = Number(document.getElementById('root').dataset.duration)
      // Out as quickly as in, and never before the reveal has finished.
      const out = Math.max(1.3, duration - 0.45)

      const title = document.getElementById('title')
      let size = 96
      while (title.scrollHeight > size * 1.05 * 2 + 4 && size > 60) {
        size -= 4
        title.style.fontSize = `${size}px`
      }

      const tl = gsap.timeline({ paused: true })
      tl.fromTo('#veil', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out' }, 0)
        .fromTo('#counter', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.5, ease: 'power3.out' }, 0.15)
        .fromTo('#title', { yPercent: 130 }, { yPercent: 0, duration: 0.8, ease: 'expo.out' }, 0.2)
        .fromTo('#rule', { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: 'expo.inOut' }, 0.45)
        .fromTo('#description', { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' }, 0.6)
        .to('#block', { opacity: 0, y: -18, duration: 0.3, ease: 'power2.in' }, out - 0.05)
        .to('#veil', { opacity: 0, duration: 0.4, ease: 'power1.in' }, out)

      window.__timelines = window.__timelines || {}
      window.__timelines['chapter'] = tl
      tl.seek(0)
    </script>
  </body>
</html>
